edition = "2023";

package UDataPacketCacheServiceAPI.V1;

import "uDataPacketCacheServiceAPI/v1/stream.proto";


/**
 * The response to a stream request.
 */
message GetStreamsRequest {
  // Contextualizes the return code for the stream request.
  enum ReturnCode {
     /// The return code is unspecified.  This is not a valid response.
     RETURN_CODE_UNSPECIFIED = 0;
     /// The query for this stream was successful.
     RETURN_CODE_SUCCESS = 1;
     /// The request was valid but there was not data.
     RETURN_CODE_NO_DATA_FOUND = 2;
     /// The provided time range was invalid - likely the end time preceeded
     /// the start time.
     RETURN_CODE_INVALID_TIME_RANGE = 3;
     /// The provided stream identifier was invalid.
     RETURN_CODE_INVALID_STREAM_IDENTIFIER = 4; 
  }
  // The stream.  Note, this may not be defined so use has_stream() prior
  // to accessing.
  Stream stream = 1;
  // The return code.
  ReturnCode return_code = 2;
}

